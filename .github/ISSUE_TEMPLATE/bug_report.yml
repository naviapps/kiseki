name: Bug report
description: Report a reproducible Kiseki problem.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing Kiseki. Do not include license keys, receipts, tokens, or private account data.
  - type: input
    id: version
    attributes:
      label: Kiseki version
      description: Open Kiseki settings and copy the version from Support.
      placeholder: "0.1.2"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "15.5"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Configure ...
        3. Perform ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Optional. Remove private information before attaching anything.
    validations:
      required: false
